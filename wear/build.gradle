plugins {
    id 'io.gitlab.arturbosch.detekt'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'dev.lucasnlm.antimine.wear'

    defaultConfig {
        // versionCode and versionName must be hardcoded to support F-droid
        applicationId 'com.batodev.antimine'
        versionCode 1702040
        versionName '17.2.4 W'
        minSdk 25
        targetSdk 37
        compileSdk = 37
        multiDexEnabled true
        vectorDrawables.useSupportLibrary true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    signingConfigs {
        release {
            if (System.getenv('IS_RELEASE_BUILD')) {
                storeFile file(System.getenv('KEYSTORE'))
                keyAlias System.getenv('KEY_ALIAS')
                storePassword System.getenv('KEY_STORE_PASSWORD')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    kotlin {
        jvmToolchain(17)
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources true
            animationsDisabled true
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    detektPlugins libs.detekt.formatting

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':external')
    implementation project(':common')
    implementation project(':control')
    implementation project(':ui')
    implementation project(':preferences')
    implementation project(':core')
    implementation project(':gdx')
    implementation project(':foss')
    implementation project(':i18n')

    // Wear OS
    implementation 'androidx.wear:wear:1.3.0'

    // AndroidX
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference.ktx
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation libs.androidx.multidex
    implementation(libs.androidx.activity.ktx) { version { strictly('1.11.0') } }
    implementation(libs.androidx.fragment.ktx) { version { strictly('1.8.9') } }

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.3'
    implementation(libs.androidx.lifecycle.runtime.ktx) { version { strictly('2.9.3') } }
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.9.3'

    // Room
    implementation 'androidx.room:room-ktx:2.8.0'

    // Constraint
    implementation libs.androidx.constraintlayout

    // Google
    implementation(libs.material) { version { strictly('1.13.0') } }

    // Koin
    implementation 'io.insert-koin:koin-android:4.1.1'
    testImplementation 'io.insert-koin:koin-test:4.1.1'

    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'

    // Tests
    testImplementation libs.junit
    testImplementation 'androidx.core:core-ktx:1.17.0'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation libs.androidx.test.rules
    testImplementation libs.androidx.test.runner
    testImplementation libs.androidx.test.espresso.core
    testImplementation 'androidx.fragment:fragment-testing:1.8.9'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation libs.androidx.test.ext.junit
    testImplementation 'io.mockk:mockk:1.14.5'

    // Core library
    androidTestImplementation libs.androidx.test.core

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

tasks.withType(Test).configureEach {
    testLogging {
        exceptionFormat 'full'
    }
    afterTest { desc, result ->
        println "Executing test ${desc.name} [${desc.className}] with result: ${result.resultType}"
    }
}
