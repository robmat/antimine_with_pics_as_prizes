plugins {
    id 'io.gitlab.arturbosch.detekt'
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'dev.lucasnlm.external'

    defaultConfig {
        minSdk 23
        targetSdk 37
        compileSdk = 37
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
}

dependencies {

    implementation project(':core')

    // Kotlin
    implementation(libs.kotlinx.coroutines.android) { version { strictly('1.10.2') } }
    implementation libs.antimine.kotlin.stdlib
    implementation libs.kotlinx.metadata.jvm
    testImplementation(libs.kotlinx.coroutines.test) { version { strictly('1.10.2') } }

    // Koin (needed for CommonExternalModule, the bindings shared by every build flavor)
    implementation(libs.koin.android) { version { strictly('4.1.1') } }
}

