plugins {
    id 'io.gitlab.arturbosch.detekt'
    id 'com.batodev.releasetools'
}

apply plugin: 'com.android.application'

if (System.getenv('IS_RELEASE_BUILD')) {
    apply plugin: 'com.google.gms.google-services'
}

apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }
def versionCodeNum = versionProps.getProperty("versionCode").toInteger()

android {
    namespace 'com.batodev.antimine'

    defaultConfig {
        versionCode versionCodeNum
        versionName versionProps.getProperty("versionName")
        minSdk 23
        targetSdk 37
        compileSdk = 37
        multiDexEnabled true
        vectorDrawables.useSupportLibrary true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    Properties localProperties = new Properties()
    localProperties.load(new FileReader(file('../local.properties')))
    signingConfigs {
        release {
                storeFile file(localProperties.get('storeFile'))
                keyAlias localProperties.get('keyAlias')
                storePassword localProperties.get('storePassword')
                keyPassword localProperties.get('keyPassword')
        }
    }

    // Instrumented tests run against releaseTest - the same R8 output as release - so
    // they exercise minified code rather than the unminified debug APK.
    testBuildType = 'releaseTest'
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        // Same R8 pipeline and signing as release, plus keeps that only the instrumentation
        // harness needs - so the release APK users get stays fully shrunk and obfuscated.
        releaseTest {
            initWith release
            matchingFallbacks = ['release']
            proguardFile 'proguard-rules-test.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    testOptions {
        unitTests {
            includeAndroidResources true
            animationsDisabled true
        }
    }

    flavorDimensions = ['version']
    productFlavors {
        google {
            dimension 'version'
            applicationId 'com.batodev.antimine'
            versionNameSuffix " S"
        }

        googleInstant {
            versionCode versionCodeNum
            dimension 'version'
            applicationId 'com.batodev.antimine'
            versionNameSuffix " I"
        }

        foss {
            dimension 'version'
            // There's a typo on F-Droid release :(
            applicationId 'com.batodev.antimine'
            versionNameSuffix " F"
        }
    }
}

// All three flavors share the same applicationId (a single Play Console
// listing), so one play {} config covers publishing - just point it at the
// google flavor's tasks specifically, since foss/googleInstant aren't
// published to Play through this path.
releaseTools {
    publishTaskName.set("publishGoogleReleaseBundle")
    promoteTaskName.set("promoteGoogleReleaseArtifact")
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':external')
    implementation project(':common')
    implementation project(':control')
    implementation project(':about')
    implementation project(':ui')
    implementation project(':preferences')
    implementation project(':themes')
    implementation project(':tutorial')
    implementation project(':core')
    implementation project(':gdx')
    implementation project(':i18n')

    googleImplementation project(':proprietary')
    googleInstantImplementation project(':proprietary')
    googleInstantImplementation project(':instant')
    fossImplementation project(':foss')
    fossImplementation project(':donation')

    googleImplementation project(':audio')
    fossImplementation project(':audio')
    googleInstantImplementation project(':audio-low')

    // AndroidX
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.multidex
    implementation(libs.androidx.activity.ktx) { version { strictly('1.11.0') } }
    implementation(libs.androidx.fragment.ktx) { version { strictly('1.8.9') } }

    // Lifecycle
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation(libs.androidx.lifecycle.runtime.ktx) { version { strictly('2.9.3') } }
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.common.java8

    // Room
    implementation(libs.androidx.room.ktx) { version { strictly('2.8.0') } }

    // Constraint
    implementation libs.androidx.constraintlayout

    // Google
    implementation(libs.material) { version { strictly('1.13.0') } }

    // Koin
    implementation(libs.koin.android) { version { strictly('4.1.1') } }
    // Something in the release graph drags in concurrent-futures-ktx 1.1.0, which predates
    // SuspendToFutureAdapter. androidx.test:core needs 1.2.0, but consistent resolution pins
    // androidTest to whatever release resolved - so R8 fails the androidTest minify with
    // "Missing class androidx.concurrent.futures.SuspendToFutureAdapter". Declaring it lifts both.
    releaseTestImplementation libs.androidx.concurrent.futures.ktx
    testImplementation(libs.koin.test) { version { strictly('4.1.1') } }

    // Kotlin
    implementation(libs.kotlinx.coroutines.android) { version { strictly('1.10.2') } }
    implementation libs.antimine.kotlin.stdlib
    implementation libs.kotlinx.metadata.jvm
    testImplementation(libs.kotlinx.coroutines.test) { version { strictly('1.10.2') } }

    // Konfetti
    implementation(libs.dionsegijn.konfetti.xml) { version { strictly('2.0.5') } }

    // Photo view
    implementation libs.chrisbanes.photoview

    // Tests
    testImplementation libs.junit
    testImplementation(libs.androidx.core.ktx) { version { strictly('1.17.0') } }
    testImplementation libs.androidx.test.core.ktx
    testImplementation libs.androidx.test.rules
    testImplementation libs.androidx.test.runner
    testImplementation libs.androidx.test.espresso.core
    testImplementation libs.androidx.fragment.testing
    testImplementation(libs.robolectric) { version { strictly('4.16') } }
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.mockk

    // Core library
    androidTestImplementation libs.androidx.test.core

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.core.ktx
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestUtil libs.androidx.test.orchestrator
}

tasks.withType(Test).configureEach {
    testLogging {
        exceptionFormat 'full'
    }
    afterTest { desc, result ->
        println "Executing test ${desc.name} [${desc.className}] with result: ${result.resultType}"
    }
}
