plugins {
    id 'io.gitlab.arturbosch.detekt'
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'dev.lucasnlm.antimine.proprietary'

    defaultConfig {
        minSdk 23
        targetSdk 37
        compileSdk = 37
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':external')

    // Amplitude
    implementation libs.amplitude.android.sdk
    implementation libs.squareup.okhttp3.okhttp

    // Google
    implementation(libs.billing.ktx) { version { strictly('8.0.0') } }
    implementation libs.play.services.instantapps
    implementation libs.play.services.games.v2
    implementation libs.play.services.auth
    implementation(libs.play.services.ads) { version { strictly('24.6.0') } }
    // play-services-ads transitively pins the ancient androidx.work:work-runtime:2.7.0 -
    // override it so WorkManager's own WorkDatabase creation doesn't crash on real
    // devices (see sgtpuzzles' fix for the full incident writeup).
    implementation libs.androidx.work.runtime
    implementation libs.google.play.review.ktx
    implementation libs.google.play.app.update.ktx

    // Jetbrains
    implementation(libs.kotlinx.coroutines.play.services) { version { strictly('1.10.2') } }

    // Kotlin
    implementation(libs.kotlinx.coroutines.android) { version { strictly('1.10.2') } }
    implementation libs.antimine.kotlin.stdlib
    implementation libs.kotlinx.metadata.jvm
    testImplementation(libs.kotlinx.coroutines.test) { version { strictly('1.10.2') } }

    // Koin
    implementation(libs.koin.android) { version { strictly('4.1.1') } }
    testImplementation(libs.koin.test) { version { strictly('4.1.1') } }
}
