buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        // AGP genuinely matches the shared catalog's version - sourced dynamically
        // since a Gradle version catalog can't reference another catalog's values.
        classpath "com.android.tools.build:gradle:${sharedLibs.versions.agp.get()}"
        classpath libs.kotlin.gradle.plugin
        classpath libs.ksp.gradle.plugin

        if (System.getenv('IS_GOOGLE_BUILD')) {
            classpath libs.google.gms
        }
    }
}

plugins {
    alias(sharedLibs.plugins.triplet.play) apply false
    alias(sharedLibs.plugins.detekt) apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
